<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宿命刻の姫君 構成台帳</title>
<meta name="theme-color" content="#3a3d8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&family=Cormorant+Garamond:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="eyebrow">シリーズ構成・各話プロット</div>
    <h1 class="logo-h"><span class="logo" id="h-logo" role="img" aria-label="宿命刻の姫君">
      <span class="lg-top" aria-hidden="true"><i></i><span>ZEED</span><i></i></span>
      <span class="lg-main" aria-hidden="true">
        <span class="lg-word"><span class="lg-ruby"><span>ジ</span><span>ー</span><span>ド</span></span><span class="lg-big">宿命刻</span></span>
        <span class="lg-no">の</span>
        <span class="lg-big">姫君</span>
      </span>
      <span class="lg-sub" aria-hidden="true">PRINCESS OF THE FATED SIGILS</span>
    </span><span id="h-title" hidden></span></h1>
    <p id="h-tag"></p>
  </div>
  <div class="tools">
    <div class="seg" role="group" aria-label="表示">
      <button id="v-edit" aria-pressed="true">エピソード</button>
      <button id="v-table" aria-pressed="false">構成表</button>
      <button id="v-chars" aria-pressed="false">キャラクター</button>
      <button id="v-lore" aria-pressed="false">設定</button>
      <button id="v-policy" aria-pressed="false">方針・編</button>
    </div>
    <button class="btn" id="b-export">Markdownで書き出す</button>
    <button class="btn danger" id="b-discard" hidden title="前回の同期のあとの変更を取り消す">変更を破棄</button>
    <button class="btn primary" id="b-sync" title="Googleドライブと同期">同期<span class="badge" hidden></span></button>
    <span id="net" aria-live="polite"></span>
    <span class="save" id="save" aria-live="polite"></span>
  </div>
</header>
<div class="stats" id="stats"></div>

<main id="main"></main>

<div id="overlay" hidden></div>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="drive.js"></script>
<script src="app.js"></script>
</body>
</html>
